# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# CI: валидация на пуш в любую ветку (теги не триггерят — их обрабатывает publish.yml).
# pull_request намеренно не используется: пуш фиче-ветки уже даёт прогон, и его статус
# виден в PR — так избегаем двойных прогонов.
#
# Сборка документации идёт здесь же как проверка: битые ссылки и невалидный toc.yml
# роняют шаг до того, как правка попадёт в main, где её ждёт деплой Pages (docs.yml).
# Шаги docfx стоят последними намеренно — приоритет у библиотеки: к моменту их
# запуска сборка, тесты и упаковка уже отработали, и падение доки не отменяет их
# результат.

name: CI

on:
  push:
    branches: ['**']

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # SDK 10 умеет собирать net9.0, но dotnet test требует рантайм 9
  DOTNET_VERSION: |
    9.0.x
    10.0.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack (validate packaging)
        run: dotnet pack --configuration Release --no-build --output ./nupkg

      - name: Restore .NET tools
        run: dotnet tool restore

      # Проверка, а не выкладка: сайт с main публикует docs.yml
      - name: Build documentation
        run: dotnet docfx docs/docfx.json
